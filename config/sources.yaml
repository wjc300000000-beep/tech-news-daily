# 数据源配置清单
# type: rss（RSS/Atom 订阅） | github_trending（专用抓取器） | web（Playwright + CSS 选择器）
# enabled: false 可临时停用某个源而不删除配置
sources:
  - name: "ScienceDaily"
    url: "https://www.sciencedaily.com/rss/all.xml"
    type: "rss"
    category: "学术前沿"

  - name: "Quanta Magazine"
    url: "https://www.quantamagazine.org/feed/"
    type: "rss"
    category: "数学与自然科学"

  - name: "麻省理工科技评论"
    # mittrchina.com/rss 返回的是 SPA 的 HTML 而非 RSS（已核实）。
    # 采用其公开免鉴权 JSON API 直采（已实测，见 pipeline/collectors/mittrchina.py）。
    # 备选方案：RSSHub 路由 https://rsshub.app/mittrchina/index
    # （公共实例不稳定，可换成 https://rsshub.rssforever.com/mittrchina/index，type 改回 rss）
    url: "https://apii.web.mittrchina.com/information/index"
    type: "mittrchina"
    category: "前沿科技"
    max_pages: 5           # 每页 4 条，按时间倒序

  - name: "动点科技 TechNode"
    # cn.technode.com/feed 被 Cloudflare 拦截（403，已核实）。
    # 默认走英文主站 feed；如需中文版，将本条改为 type: web + Playwright。
    url: "https://technode.com/feed/"
    type: "rss"
    category: "科技创投"

  - name: "Hacker News"
    # 用 frontpage 代替 newest：信噪比更高，条目更少更精
    url: "https://hnrss.org/frontpage"
    type: "rss"
    category: "开发者社区"

  - name: "GitHub Trending"
    # 无官方 RSS；页面为服务端渲染，直接用内置 requests+BS4 抓取器
    # （公共 RSSHub 实例不稳定，实测超时，故不依赖）
    url: "https://github.com/trending"
    type: "github_trending"
    category: "开源项目"
    since: "daily"

  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    type: "rss"
    category: "科技深度"

  - name: "少数派"
    url: "https://sspai.com/feed"
    type: "rss"
    category: "效率与生活"

  - name: "Knowable Magazine"
    # 该刊已从 knowablemag.org 迁移到 knowablemagazine.org；旧域名全站 403（WAF），
    # 新域名 /rss 可直连（已实测 HTTP 200 + 有效 RSS，20 条）
    url: "https://knowablemagazine.org/rss"
    type: "rss"
    category: "学术前沿"
    window_hours: 168      # 周更刊物，放宽到 7 天时间窗口，否则每日抓取很难命中
